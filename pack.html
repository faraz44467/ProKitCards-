<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ProKitCards — Open a Pack</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #04060f; --gold1: #d4a843; --gold2: #f5e07a; --gold3: #7a4f00;
      --accent: #00d4ff; --text: #e8eaf6; --muted: #556070;
      --font-h: 'Bebas Neue', sans-serif;
      --font-b: 'Rajdhani', sans-serif;
      --font-o: 'Orbitron', sans-serif;
    }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-b); overflow-x: hidden; }
    .bg { position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(0,212,255,.07) 0%, transparent 70%),
                  radial-gradient(ellipse 60% 40% at 80% 80%, rgba(180,74,255,.07) 0%, transparent 60%); }
    .bg-grid { position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image: linear-gradient(rgba(0,212,255,.02) 1px, transparent 1px), linear-gradient(90deg, rgba(0,212,255,.02) 1px, transparent 1px);
      background-size: 48px 48px; }
    #sparks, #lightning { position: fixed; inset: 0; z-index: 50; pointer-events: none; }
    #lightning { z-index: 55; }
    #screenFlash { position: fixed; inset: 0; z-index: 200; background: white; opacity: 0; pointer-events: none; transition: opacity .1s; }
    .shockwave { position: fixed; z-index: 60; border-radius: 50%; border: 3px solid rgba(255,255,255,.8);
      pointer-events: none; transform: translate(-50%, -50%) scale(0); animation: shockwaveExp .8s ease-out forwards; }
    @keyframes shockwaveExp { 0% { transform: translate(-50%,-50%) scale(0); opacity:1; } 100% { transform: translate(-50%,-50%) scale(8); opacity:0; } }
    nav { position: relative; z-index: 100; display: flex; align-items: center; justify-content: space-between;
      padding: 1rem 2rem; border-bottom: 1px solid rgba(255,255,255,.06);
      background: rgba(4,6,15,.85); backdrop-filter: blur(16px); }
    .nav-logo { font-family: var(--font-h); font-size: 1.6rem; letter-spacing: .1em; }
    .nav-logo span:nth-child(1) { color: var(--accent); }
    .nav-logo span:nth-child(3) { color: transparent; -webkit-text-stroke: 1px var(--gold1); }
    .nav-back { font-family: var(--font-b); font-weight: 700; font-size: .9rem; letter-spacing: .1em;
      color: var(--muted); text-decoration: none; border: 1px solid rgba(255,255,255,.08);
      padding: .4rem 1rem; border-radius: 8px; transition: all .2s; }
    .nav-back:hover { color: var(--text); border-color: var(--accent); }
    .stage { position: relative; z-index: 10; min-height: calc(100vh - 60px);
      display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem 1rem; gap: 2rem; }
    .screen { display: none; flex-direction: column; align-items: center; gap: 1.5rem; width: 100%; }
    .screen.active { display: flex; }
    .choose-title { font-family: var(--font-h); font-size: clamp(2rem,6vw,3.5rem); letter-spacing: .12em; text-align: center; }
    .choose-title span { color: var(--gold2); }
    .choose-sub { color: var(--muted); letter-spacing: .1em; font-size: .9rem; text-transform: uppercase; }
    .pack-selection { display: flex; gap: 1.5rem; flex-wrap: wrap; justify-content: center; }
    .pack-choice { width: 160px; background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.08);
      border-radius: 16px; padding: 1.4rem 1rem; cursor: pointer; transition: all .3s; text-align: center; position: relative; overflow: hidden; }
    .pack-choice::before { content: ''; position: absolute; inset: 0; opacity: 0; transition: opacity .3s; }
    .pack-choice.gold::before   { background: radial-gradient(circle at 50% 0%, rgba(212,168,67,.3), transparent 70%); }
    .pack-choice.icon::before   { background: radial-gradient(circle at 50% 0%, rgba(180,74,255,.3), transparent 70%); }
    .pack-choice.toty::before   { background: radial-gradient(circle at 50% 0%, rgba(0,212,255,.3), transparent 70%); }
    .pack-choice.inform::before { background: radial-gradient(circle at 50% 0%, rgba(46,204,113,.3), transparent 70%); }
    .pack-choice:hover { transform: translateY(-8px) scale(1.03); border-color: rgba(255,255,255,.25); box-shadow: 0 20px 40px rgba(0,0,0,.5); }
    .pack-choice:hover::before { opacity: 1; }
    .pack-choice .pack-icon { font-size: 2.8rem; margin-bottom: .5rem; }
    .pack-choice .pack-name { font-family: var(--font-h); font-size: 1.1rem; letter-spacing: .1em; margin-bottom: .3rem; }
    .pack-choice .pack-desc { font-size: .75rem; color: var(--muted); }
    .pack-choice .pack-cards-count { margin-top: .6rem; font-family: var(--font-o); font-size: .65rem; letter-spacing: .1em; color: var(--gold1); }
    .pack-choice.gold   .pack-name { color: var(--gold2); }
    .pack-choice.icon   .pack-name { color: #e0aaff; }
    .pack-choice.toty   .pack-name { color: var(--accent); }
    .pack-choice.inform .pack-name { color: #a8f0c8; }
    .pack-title-small { font-family: var(--font-h); font-size: 1.2rem; letter-spacing: .2em; color: var(--muted); text-transform: uppercase; }
    .pack-stage { display: flex; flex-direction: column; align-items: center; gap: 1.5rem; }
    .pack-wrap { perspective: 1200px; cursor: pointer; }
    .pack-object { width: 220px; height: 300px; border-radius: 16px; position: relative; transform-style: preserve-3d; animation: packFloat 3s ease-in-out infinite; }
    @keyframes packFloat { 0%,100% { transform: translateY(0) rotateY(-6deg) rotateX(3deg); } 50% { transform: translateY(-14px) rotateY(6deg) rotateX(-3deg); } }
    .pack-object.shake  { animation: packShake  .45s ease-in-out; }
    .pack-object.shake2 { animation: packShake2 .5s ease-in-out; }
    .pack-object.tear   { animation: packTear 1s cubic-bezier(.23,1,.32,1) forwards; }
    @keyframes packShake  { 0%,100%{transform:translateX(0) rotateZ(0) scale(1)} 15%{transform:translateX(-12px) rotateZ(-4deg) scale(1.02)} 30%{transform:translateX(12px) rotateZ(4deg) scale(1.04)} 45%{transform:translateX(-10px) rotateZ(-3deg) scale(1.02)} 60%{transform:translateX(10px) rotateZ(3deg) scale(1.04)} 75%{transform:translateX(-6px) rotateZ(-2deg) scale(1.02)} 90%{transform:translateX(6px) rotateZ(2deg)} }
    @keyframes packShake2 { 0%,100%{transform:translateX(0) rotateZ(0) scale(1)} 10%{transform:translateX(-16px) rotateZ(-6deg) scale(1.06)} 25%{transform:translateX(16px) rotateZ(6deg) scale(1.08)} 40%{transform:translateX(-14px) rotateZ(-5deg) scale(1.06)} 55%{transform:translateX(14px) rotateZ(5deg) scale(1.08)} 70%{transform:translateX(-10px) rotateZ(-3deg) scale(1.04)} 85%{transform:translateX(10px) rotateZ(3deg) scale(1.02)} }
    @keyframes packTear { 0%{transform:scale(1) rotateY(0) rotateZ(0);filter:brightness(1)} 20%{transform:scale(1.2) rotateY(15deg) rotateZ(-3deg);filter:brightness(2)} 40%{transform:scale(1.3) rotateY(-20deg) rotateZ(5deg);filter:brightness(3) saturate(2)} 60%{transform:scale(1.1) rotateY(30deg) rotateZ(-8deg) translateY(-20px);filter:brightness(4)} 80%{transform:scale(0.3) rotateY(60deg) rotateZ(15deg) translateY(-60px);filter:brightness(5) blur(2px);opacity:0.5} 100%{transform:scale(0) rotateY(90deg) translateY(-100px);opacity:0;filter:blur(8px)} }
    .pack-face { width:100%; height:100%; border-radius:16px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.5rem;
      position:relative; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.1); }
    .pack-face::after { content:''; position:absolute; inset:0; background:linear-gradient(135deg,rgba(255,255,255,.2) 0%,transparent 50%,rgba(0,0,0,.2) 100%); }
    .pack-face .pack-emoji { font-size:4rem; z-index:1; }
    .pack-face .pack-face-name { font-family:var(--font-h); font-size:1.4rem; letter-spacing:.15em; z-index:1; }
    .pack-face .pack-face-sub { font-size:.72rem; letter-spacing:.14em; color:rgba(255,255,255,.6); z-index:1; text-transform:uppercase; }
    .pack-face .pack-shine { position:absolute; inset:0; background:linear-gradient(45deg,transparent 30%,rgba(255,255,255,.2) 50%,transparent 70%); background-size:200% 200%; animation:packShine 2s linear infinite; }
    @keyframes packShine { 0%{background-position:-100% -100%} 100%{background-position:200% 200%} }
    .pack-gold   { background: linear-gradient(160deg, #c8922a, #6b3d00, #e8c84a); }
    .pack-icon   { background: linear-gradient(160deg, #8822dd, #440088, #cc88ff); }
    .pack-toty   { background: linear-gradient(160deg, #0044ff, #001188, #4488ff); }
    .pack-inform { background: linear-gradient(160deg, #1a9950, #0a5530, #4dcc88); }
    .pack-hint { font-size:.85rem; color:var(--muted); letter-spacing:.12em; text-transform:uppercase; animation:blink 1.4s ease-in-out infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }
    .tap-dots { display:flex; gap:.5rem; }
    .tap-dot { width:12px; height:12px; border-radius:50%; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2); transition:all .3s; }
    .tap-dot.active { background:var(--gold1); box-shadow:0 0 14px var(--gold1); border-color:var(--gold2); transform:scale(1.3); }
    .reveal-title { font-family:var(--font-h); font-size:clamp(1.8rem,5vw,3rem); letter-spacing:.12em; text-align:center; animation:titlePop .5s cubic-bezier(.23,1,.32,1) both; }
    @keyframes titlePop { from{transform:scale(.5);opacity:0} to{transform:scale(1);opacity:1} }
    .reveal-title span { color:var(--gold2); }
    .cards-reveal-grid { display:flex; flex-wrap:wrap; justify-content:center; gap:1.4rem; }
    .pack-card { width:160px; height:224px; border-radius:14px; position:relative; overflow:hidden; cursor:pointer;
      box-shadow:0 16px 48px rgba(0,0,0,.8); opacity:0; transform-style:preserve-3d; transition:box-shadow .3s; }
    .pack-card:hover { transform:scale(1.08) translateY(-8px) !important; box-shadow:0 28px 64px rgba(0,0,0,.9),0 0 30px rgba(212,168,67,.3); }
    .pack-card .card-bg { position:absolute; inset:0; z-index:0; }
    .pack-card .card-shine-overlay { position:absolute; inset:0; z-index:1; background:linear-gradient(135deg,rgba(255,255,255,.2) 0%,transparent 45%,rgba(0,0,0,.12) 100%); }
    .pack-card .card-inner { position:relative; z-index:2; height:100%; display:flex; flex-direction:column; align-items:center; padding:10px 0 6px; }
    .pack-card .c-top { align-self:flex-start; padding-left:10px; margin-bottom:2px; }
    .pack-card .c-rating { font-family:var(--font-h); font-size:1.8rem; line-height:1; color:rgba(0,0,0,.75); }
    .pack-card .c-pos   { font-family:var(--font-h); font-size:.8rem; color:rgba(0,0,0,.6); }
    .pack-card .c-flag  { font-size:.95rem; }
    .pack-card .c-photo { font-size:3.8rem; line-height:1; margin:2px 0; filter:drop-shadow(0 4px 8px rgba(0,0,0,.4)); }
    .pack-card .c-name  { font-family:var(--font-h); font-size:1rem; letter-spacing:.1em; color:rgba(0,0,0,.8); text-shadow:0 1px 0 rgba(255,255,255,.25); }
    .pack-card .c-divider { width:calc(100% - 20px); height:1px; background:rgba(0,0,0,.2); margin:4px 0; }
    .pack-card .c-stats { display:flex; justify-content:space-around; width:100%; padding:0 6px; }
    .pack-card .c-stat  { display:flex; flex-direction:column; align-items:center; gap:1px; }
    .pack-card .c-sv { font-family:var(--font-h); font-size:.82rem; color:rgba(0,0,0,.8); line-height:1; }
    .pack-card .c-sk { font-size:.44rem; font-weight:700; color:rgba(0,0,0,.5); letter-spacing:.05em; font-family:var(--font-b); }
    .pack-card .c-club { font-family:var(--font-b); font-size:.55rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:rgba(0,0,0,.45); margin-top:2px; }
    .pack-card.special::after { content:''; position:absolute; inset:-3px; z-index:-1; border-radius:17px;
      background:linear-gradient(45deg,#d4a843,#ff44ff,#00d4ff,#44ff88,#d4a843); background-size:400% 400%; animation:rainbowBorder 1.5s linear infinite; }
    @keyframes rainbowBorder { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
    @keyframes flyFromLeft   { from{transform:translateX(-120vw) rotate(-30deg) scale(.3);opacity:0} to{transform:translateX(0) rotate(0) scale(1);opacity:1} }
    @keyframes flyFromRight  { from{transform:translateX(120vw) rotate(30deg) scale(.3);opacity:0}  to{transform:translateX(0) rotate(0) scale(1);opacity:1} }
    @keyframes flyFromTop    { from{transform:translateY(-120vh) rotate(-20deg) scale(.3);opacity:0} to{transform:translateY(0) rotate(0) scale(1);opacity:1} }
    @keyframes flyFromBottom { from{transform:translateY(120vh) rotate(20deg) scale(.3);opacity:0}  to{transform:translateY(0) rotate(0) scale(1);opacity:1} }
    @keyframes flyFromTL     { from{transform:translate(-80vw,-80vh) rotate(-40deg) scale(.2);opacity:0} to{transform:translate(0,0) rotate(0) scale(1);opacity:1} }
    @keyframes flyFromTR     { from{transform:translate(80vw,-80vh) rotate(40deg) scale(.2);opacity:0}  to{transform:translate(0,0) rotate(0) scale(1);opacity:1} }
    .fly-left   { animation:flyFromLeft   .7s cubic-bezier(.23,1,.32,1) forwards; }
    .fly-right  { animation:flyFromRight  .7s cubic-bezier(.23,1,.32,1) forwards; }
    .fly-top    { animation:flyFromTop    .7s cubic-bezier(.23,1,.32,1) forwards; }
    .fly-bottom { animation:flyFromBottom .7s cubic-bezier(.23,1,.32,1) forwards; }
    .fly-tl     { animation:flyFromTL     .7s cubic-bezier(.23,1,.32,1) forwards; }
    .fly-tr     { animation:flyFromTR     .7s cubic-bezier(.23,1,.32,1) forwards; }
    .btn-primary { font-family:var(--font-h); font-size:1.1rem; letter-spacing:.12em; padding:.8rem 2.5rem;
      background:linear-gradient(135deg,var(--gold3),var(--gold1),var(--gold2)); border:none; border-radius:12px;
      color:#1a0e00; cursor:pointer; transition:all .25s; position:relative; overflow:hidden; }
    .btn-primary::after { content:''; position:absolute; inset:0; background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent); transform:translateX(-100%); transition:transform .5s; }
    .btn-primary:hover::after { transform:translateX(100%); }
    .btn-primary:hover { transform:translateY(-2px); box-shadow:0 8px 28px rgba(212,168,67,.4); }
    .btn-secondary { font-family:var(--font-b); font-weight:700; font-size:.95rem; letter-spacing:.1em; padding:.7rem 2rem;
      background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1); border-radius:12px; color:var(--text); cursor:pointer; transition:all .2s; }
    .btn-secondary:hover { border-color:var(--accent); background:rgba(0,212,255,.08); }
    .btn-row { display:flex; gap:1rem; flex-wrap:wrap; justify-content:center; margin-top:.5rem; }
    .confetti-piece { position:fixed; border-radius:2px; z-index:300; pointer-events:none; animation:confettiFall linear forwards; }
    @keyframes confettiFall { 0%{transform:translateY(-20px) rotate(0deg);opacity:1} 100%{transform:translateY(105vh) rotate(720deg);opacity:0} }
    @media(max-width:600px) {
      .pack-selection{gap:.8rem} .pack-choice{width:130px;padding:1rem .7rem}
      .pack-object{width:180px;height:250px} .pack-card{width:130px;height:182px}
      .pack-card .c-rating{font-size:1.5rem} .pack-card .c-photo{font-size:3rem}
    }
  </style>
</head>
<body>
<div class="bg"></div>
<div class="bg-grid"></div>
<canvas id="sparks"></canvas>
<canvas id="lightning"></canvas>
<div id="screenFlash"></div>

<nav>
  <div class="nav-logo"><span>PRO</span><span style="color:#fff">KIT</span><span>CARDS</span></div>
  <a href="index.html" class="nav-back">← Back to Editor</a>
</nav>

<div class="stage">
  <!-- SCREEN 1: Choose Pack -->
  <div class="screen active" id="screenChoose">
    <h1 class="choose-title">Open a <span>Pack</span></h1>
    <p class="choose-sub">Choose your pack — luck decides the rest</p>
    <div class="pack-selection">
      <div class="pack-choice gold"   onclick="choosePack('gold')">  <div class="pack-icon">📦</div><div class="pack-name">Gold Pack</div>  <div class="pack-desc">Rare gold players</div>   <div class="pack-cards-count">5 CARDS</div></div>
      <div class="pack-choice icon"   onclick="choosePack('icon')">  <div class="pack-icon">💎</div><div class="pack-name">Icon Pack</div>  <div class="pack-desc">Legendary icons only</div><div class="pack-cards-count">3 CARDS</div></div>
      <div class="pack-choice toty"   onclick="choosePack('toty')">  <div class="pack-icon">👑</div><div class="pack-name">TOTY Pack</div>  <div class="pack-desc">Team of the Year</div>   <div class="pack-cards-count">4 CARDS</div></div>
      <div class="pack-choice inform" onclick="choosePack('inform')"><div class="pack-icon">🔥</div><div class="pack-name">In Form</div>    <div class="pack-desc">Hot weekly picks</div>   <div class="pack-cards-count">5 CARDS</div></div>
    </div>
  </div>

  <!-- SCREEN 2: Open Pack -->
  <div class="screen" id="screenOpen">
    <p class="pack-title-small" id="packLabel">Gold Pack</p>
    <div class="pack-stage">
      <div class="pack-wrap" onclick="handleTap()">
        <div class="pack-object" id="packObject">
          <div class="pack-face" id="packFace">
            <div class="pack-shine"></div>
            <div class="pack-emoji" id="packEmoji">📦</div>
            <div class="pack-face-name" id="packFaceName">GOLD</div>
            <div class="pack-face-sub">PACK</div>
          </div>
        </div>
      </div>
      <div class="tap-dots" id="tapDots">
        <div class="tap-dot" id="dot0"></div>
        <div class="tap-dot" id="dot1"></div>
        <div class="tap-dot" id="dot2"></div>
      </div>
      <p class="pack-hint" id="packHint">Tap to charge</p>
    </div>
  </div>

  <!-- SCREEN 3: Cards Reveal -->
  <div class="screen" id="screenReveal">
    <h2 class="reveal-title">You got <span id="revealCount">5</span> cards!</h2>
    <div class="cards-reveal-grid" id="cardsGrid"></div>
    <div class="btn-row">
      <button class="btn-primary"   onclick="openAgain()">🎁 Open Another</button>
      <button class="btn-secondary" onclick="goChoose()">← Choose Pack</button>
    </div>
  </div>
</div>

  toty: [

    {name:'GAKPO',   flag:'🇳🇱',pos:'LW', rat:86,pac:88,sho:84,pas:77,dri:86,def:38,phy:76,club:'Liverpool',  emoji:'🎯'},

};
const PACK_CONFIG = {
  gold:   {label:'Gold Pack',   emoji:'📦',faceClass:'pack-gold',  cardColors:['#d4a843','#7a4f00','#f5d978'],count:5},
  icon:   {label:'Icon Pack',   emoji:'💎',faceClass:'pack-icon',  cardColors:['#b44aff','#6600cc','#e0aaff'],count:3},
  toty:   {label:'TOTY Pack',   emoji:'👑',faceClass:'pack-toty',  cardColors:['#1a1aff','#0000aa','#7ab4ff'],count:4},
  inform: {label:'In Form Pack',emoji:'🔥',faceClass:'pack-inform',cardColors:['#2ecc71','#1a7a44','#a8f0c8'],count:5},
};
const FLY_CLASSES = ['fly-left','fly-right','fly-top','fly-bottom','fly-tl','fly-tr'];
let currentPack='gold', tapCount=0, canTap=true;

function showScreen(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); document.getElementById(id).classList.add('active'); }

function choosePack(type){
  currentPack=type; tapCount=0; canTap=true;
  const cfg=PACK_CONFIG[type];
  document.getElementById('packLabel').textContent=cfg.label;
  document.getElementById('packEmoji').textContent=cfg.emoji;
  document.getElementById('packFaceName').textContent=type.toUpperCase();
  document.getElementById('packHint').textContent='Tap to charge';
  document.getElementById('packFace').className='pack-face '+cfg.faceClass;
  [0,1,2].forEach(i=>document.getElementById('dot'+i).classList.remove('active'));
  const obj=document.getElementById('packObject');
  obj.className='pack-object'; obj.style.animation=''; void obj.offsetWidth;
  obj.style.animation='packFloat 3s ease-in-out infinite';
  showScreen('screenOpen');
}

function handleTap(){
  if(!canTap) return;
  tapCount++;
  const obj=document.getElementById('packObject');
  const hint=document.getElementById('packHint');
  const rect=obj.getBoundingClientRect();
  const cx=rect.left+rect.width/2, cy=rect.top+rect.height/2;
  const dot=document.getElementById('dot'+(tapCount-1));
  if(dot) dot.classList.add('active');

  if(tapCount===1){
    obj.style.animation='none'; void obj.offsetWidth; obj.classList.add('shake');
    hint.textContent='⚡ Charging...';
    sparksAt(cx,cy,12); lightningStrike(cx,cy,3);
    setTimeout(()=>{ obj.classList.remove('shake'); obj.style.animation='packFloat 3s ease-in-out infinite'; },450);
  } else if(tapCount===2){
    obj.style.animation='none'; void obj.offsetWidth; obj.classList.add('shake2');
    hint.textContent='⚡⚡ Almost there...';
    sparksAt(cx,cy,25); lightningStrike(cx,cy,6); spawnShockwave(cx,cy);
    setTimeout(()=>{ obj.classList.remove('shake2'); obj.style.animation='packFloat 3s ease-in-out infinite'; },500);
  } else {
    canTap=false; hint.textContent='';
    obj.style.animation='none'; void obj.offsetWidth;
    lightningStrike(cx,cy,12); sparksAt(cx,cy,50);
    for(let i=0;i<3;i++) setTimeout(()=>{ lightningStrike(cx,cy,8); sparksAt(cx,cy,20); },i*120);
    setTimeout(()=>{ screenFlash(); spawnShockwave(cx,cy); spawnShockwave(cx,cy); },200);
    setTimeout(()=>{ obj.classList.add('tear'); sparksAt(cx,cy,80); lightningStrike(cx,cy,15); },350);
    setTimeout(()=>revealCards(),1100);
  }
}

function revealCards(){
  const cfg=PACK_CONFIG[currentPack]; const pool=PLAYERS[currentPack];
  const [c1,c2,c3]=cfg.cardColors; const grid=document.getElementById('cardsGrid');
  document.getElementById('revealCount').textContent=cfg.count;
  grid.innerHTML=''; screenFlash(0.6);
  const shuffled=[...pool].sort(()=>Math.random()-.5);
  const picked=shuffled.slice(0,Math.min(cfg.count,shuffled.length));
  while(picked.length<cfg.count) picked.push(pool[Math.floor(Math.random()*pool.length)]);
  showScreen('screenReveal');
  picked.forEach((p,i)=>{
    const isSpecial=p.rat>=95;
    const flyClass=FLY_CLASSES[i%FLY_CLASSES.length];
    const card=document.createElement('div');
    card.className='pack-card'+(isSpecial?' special':'');
    card.innerHTML=`<div class="card-bg" style="background:linear-gradient(160deg,${c1} 0%,${c2} 55%,${c3} 100%)"></div>
      <div class="card-shine-overlay"></div>
      <div class="card-inner">
        <div class="c-top"><div class="c-rating">${p.rat}</div><div class="c-pos">${p.pos}</div><div class="c-flag">${p.flag}</div></div>
        <div class="c-photo">${p.emoji}</div>
        <div class="c-name">${p.name}</div>
        <div class="c-divider"></div>
        <div class="c-stats">
          <div class="c-stat"><span class="c-sv">${p.pac}</span><span class="c-sk">PAC</span></div>
          <div class="c-stat"><span class="c-sv">${p.sho}</span><span class="c-sk">SHO</span></div>
          <div class="c-stat"><span class="c-sv">${p.pas}</span><span class="c-sk">PAS</span></div>
          <div class="c-stat"><span class="c-sv">${p.dri}</span><span class="c-sk">DRI</span></div>
          <div class="c-stat"><span class="c-sv">${p.def}</span><span class="c-sk">DEF</span></div>
          <div class="c-stat"><span class="c-sv">${p.phy}</span><span class="c-sk">PHY</span></div>
        </div>
        <div class="c-club">${p.club}</div>
      </div>`;
    grid.appendChild(card);
    setTimeout(()=>{
      card.style.opacity='1'; card.classList.add(flyClass);
      const r=card.getBoundingClientRect();
      sparksAt(r.left+65,r.top+112,isSpecial?30:10);
      if(isSpecial){ confettiBurst(); lightningStrike(r.left+65,r.top+112,5); }
    },150+i*220);
  });
}

function openAgain(){ choosePack(currentPack); }
function goChoose(){ showScreen('screenChoose'); }

function screenFlash(intensity=1){
  const el=document.getElementById('screenFlash');
  el.style.opacity=intensity; setTimeout(()=>{ el.style.opacity=0; },80);
}
function spawnShockwave(x,y){
  const sw=document.createElement('div'); sw.className='shockwave';
  sw.style.cssText=`left:${x}px;top:${y}px;width:100px;height:100px;`;
  document.body.appendChild(sw); setTimeout(()=>sw.remove(),900);
}

// Sparks
const sparksCanvas=document.getElementById('sparks'), sCtx=sparksCanvas.getContext('2d');
let sparksArr=[];
function resizeSparks(){ sparksCanvas.width=window.innerWidth; sparksCanvas.height=window.innerHeight; }
resizeSparks(); window.addEventListener('resize',resizeSparks);
function sparksAt(x,y,count){
  const colors=['#d4a843','#f5e07a','#00d4ff','#ffffff','#ff4aff','#4aff88'];
  for(let i=0;i<count;i++){
    const angle=Math.random()*Math.PI*2, speed=Math.random()*8+2;
    sparksArr.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,
      life:1,decay:Math.random()*.025+.012,size:Math.random()*4+1,
      color:colors[Math.floor(Math.random()*colors.length)]});
  }
}
function animateSparks(){
  sCtx.clearRect(0,0,sparksCanvas.width,sparksCanvas.height);
  sparksArr=sparksArr.filter(s=>s.life>0);
  sparksArr.forEach(s=>{ s.x+=s.vx; s.y+=s.vy; s.vy+=.2; s.vx*=.98; s.life-=s.decay;
    sCtx.globalAlpha=Math.max(0,s.life); sCtx.fillStyle=s.color;
    sCtx.beginPath(); sCtx.arc(s.x,s.y,s.size,0,Math.PI*2); sCtx.fill(); });
  sCtx.globalAlpha=1; requestAnimationFrame(animateSparks);
}
animateSparks();

// Lightning
const lCanvas=document.getElementById('lightning'), lCtx=lCanvas.getContext('2d');
let lightningBolts=[];
function resizeLightning(){ lCanvas.width=window.innerWidth; lCanvas.height=window.innerHeight; }
resizeLightning(); window.addEventListener('resize',resizeLightning);
function lightningStrike(cx,cy,count){
  for(let i=0;i<count;i++){
    const angle=Math.random()*Math.PI*2, length=Math.random()*120+60;
    const pts=genLightning(cx,cy,cx+Math.cos(angle)*length,cy+Math.sin(angle)*length,4);
    lightningBolts.push({points:pts,life:1,decay:Math.random()*.15+.1,
      color:Math.random()>.5?'#00d4ff':'#ffffff',width:Math.random()*2+1});
  }
}
function genLightning(x1,y1,x2,y2,depth){
  if(depth===0) return [{x:x1,y:y1},{x:x2,y:y2}];
  const mx=(x1+x2)/2+(Math.random()-.5)*40, my=(y1+y2)/2+(Math.random()-.5)*40;
  return [...genLightning(x1,y1,mx,my,depth-1),...genLightning(mx,my,x2,y2,depth-1)];
}
function animateLightning(){
  lCtx.clearRect(0,0,lCanvas.width,lCanvas.height);
  lightningBolts=lightningBolts.filter(b=>b.life>0);
  lightningBolts.forEach(b=>{
    b.life-=b.decay; lCtx.globalAlpha=Math.max(0,b.life);
    lCtx.strokeStyle=b.color; lCtx.lineWidth=b.width*b.life;
    lCtx.shadowBlur=15; lCtx.shadowColor=b.color;
    lCtx.beginPath(); b.points.forEach((p,i)=>i===0?lCtx.moveTo(p.x,p.y):lCtx.lineTo(p.x,p.y)); lCtx.stroke();
  });
  lCtx.globalAlpha=1; lCtx.shadowBlur=0; requestAnimationFrame(animateLightning);
}
animateLightning();

// Confetti
function confettiBurst(){
  const colors=['#d4a843','#f5e07a','#00d4ff','#ff4aff','#4aff91','#ff4444','#ffffff','#ff8800'];
  for(let i=0;i<80;i++){
    const el=document.createElement('div'); el.className='confetti-piece';
    el.style.cssText=`left:${Math.random()*100}vw;top:-20px;background:${colors[Math.floor(Math.random()*colors.length)]};
      transform:rotate(${Math.random()*360}deg);animation-duration:${Math.random()*2+1.5}s;
      animation-delay:${Math.random()*.6}s;width:${Math.random()*10+4}px;height:${Math.random()*14+6}px;
      border-radius:${Math.random()>.5?'50%':'2px'};`;
    document.body.appendChild(el); setTimeout(()=>el.remove(),3500);
  }
}
</script>
